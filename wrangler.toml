# Cloudflare Worker configuration.
#
# The deployment was previously auto-detected from the GitHub connection with
# no config file. It needs one now because gate 18 requires /wp-content/* to be
# served from R2 at its original paths, and that needs a bucket binding.
#
#   "Asset parity: all 216 images + 8 PDFs served from Pages at same paths
#    (/wp-content/uploads/... preserved verbatim to keep every external
#    citation and AI-crawler reference alive)."
#
# See worker/index.ts for the routing, and src/lib/assets.ts for why the
# content keeps root-relative paths.

name = "srj-site"
main = "worker/index.ts"
compatibility_date = "2026-07-01"

# The built site. `binding` is what makes env.ASSETS available to the Worker;
# without it the Worker cannot serve the site at all and every route 404s.
#
# run_worker_first is required: by default the static handler answers before the
# Worker ever runs, so a /wp-content/ request would 404 at the asset layer and
# never reach the R2 fallback. The Worker still calls env.ASSETS.fetch() first
# for those paths, so build output keeps priority; this only guarantees the
# Worker gets to make that decision.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/wp-content/*"]

# The migrated WordPress media tree: 1,236 referenced objects, ~278 MB.
# Uploaded with rclone rather than the dashboard because 901 of the filenames
# contain spaces and the dashboard stores those percent-encoded, which breaks
# the key-to-URL match.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "srj-assets"
