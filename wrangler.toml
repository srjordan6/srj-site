# Cloudflare Worker configuration.
#
# The deployment was previously auto-detected from the GitHub connection with no
# config file. It needs one because gate 18 requires /wp-content/* to be served
# from R2 at its original paths, and stage 4 needs POST endpoints for the forms.
#
#   "Asset parity: all 216 images + 8 PDFs served from Pages at same paths
#    (/wp-content/uploads/... preserved verbatim to keep every external
#    citation and AI-crawler reference alive)."
#
# NOTE ON THE BUILD COMMAND. Adding this file switched the project from
# Cloudflare's auto-detected Astro build to config-driven deploy, and in that
# mode only the explicit commands run. The dashboard Build command must be
# `bun run build`; without it `astro build` never runs, dist/ does not exist,
# and the deploy fails on assets.directory. That is not expressible here.

name = "srj-site"
main = "worker/index.ts"
compatibility_date = "2026-07-01"

# The built site. `binding` is what makes env.ASSETS available to the Worker;
# without it the Worker cannot serve the site at all and every route 404s.
#
# run_worker_first is required for these paths: by default the static handler
# answers before the Worker runs, so a /wp-content/ request would 404 at the
# asset layer and never reach the R2 fallback, and a POST to /api/contact would
# hit the static 404 page instead of the handler. The Worker still calls
# env.ASSETS.fetch() first for /wp-content/, so build output keeps priority.
#
# /api/glossary.json, /api/tools.json and /api/laws.json are deliberately NOT
# listed: those are static build artifacts and should be served straight from
# the asset layer without waking the Worker.
# Workers Logs: persistent, dashboard-queryable logs (Workers & Pages ->
# srj-site -> Logs). Enabled July 30 to capture the worksheet gate's
# `turnstile: rejected, codes=[...]` line without having to time a live
# tail against a manual form submission.
[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [
  "/wp-content/*", "/api/contact", "/api/upload",
  "/api/worksheet-access", "/api/worksheet-confirm", "/api/newsletter", "/api/archive",
  "/api/assets-manifest", "/api/fix-book06",
]
# Serve dist/404.html for any path with no matching asset that the Worker
# does not claim. Without this a miss is a blank Astro-runtime 404.
not_found_handling = "404-page"

# The migrated WordPress media tree: 1,236 referenced objects, ~278 MB.
# Uploaded with rclone rather than the dashboard because 901 of the filenames
# contain spaces and the dashboard stores those percent-encoded, which breaks
# the key-to-URL match.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "srj-assets"

# Client file uploads. A SEPARATE, PRIVATE bucket, deliberately.
#
# srj-assets is public: everything in it is one URL away from anyone. Client
# engagement material must never share that property, so it goes here, and this
# bucket must have no public development URL and no custom domain. Objects are
# reachable only through this Worker's binding.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "srj-uploads"
